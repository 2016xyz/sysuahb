<div class="row tile">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins">
            <h3 class="ibox-title" langtag="word-edit"></h3>
            <div class="ibox-content">
                <form class="form-horizontal">
                    <div class="form-group" id="name">
                        <label class="control-label font-bold" langtag="word-name"></label>
                        <div class="col-sm-12">
                            <input class="form-control" name="name" type="text" value="{{.p.Name}}">
                        </div>
                    </div>
                    <div class="form-group" id="host">
                        <label class="control-label font-bold" langtag="word-host"></label>
                        <div class="col-sm-12">
                            <input class="form-control" name="host" type="text" value="{{.p.Host}}">
                        </div>
                    </div>
                    <div class="form-group" id="port">
                        <label class="control-label font-bold" langtag="word-port"></label>
                        <div class="col-sm-12">
                            <input class="form-control" name="port" type="text" value="{{.p.Port}}">
                        </div>
                    </div>
                    <div class="form-group" id="username">
                        <label class="control-label font-bold" langtag="word-username"></label>
                        <div class="col-sm-12">
                            <input class="form-control" name="username" type="text" value="{{.p.Username}}" autocomplete="off">
                        </div>
                    </div>
                    <div class="form-group" id="password">
                        <label class="control-label font-bold" langtag="word-password"></label>
                        <div class="col-sm-12">
                            <input class="form-control" name="password" type="text" value="" placeholder="" autocomplete="off">
                            <span class="help-block m-b-none" langtag="info-keeppassword"></span>
                        </div>
                    </div>
                    <div class="form-group" id="http">
                        <label class="control-label font-bold" langtag="word-http"></label>
                        <div class="col-sm-12">
                            <select class="form-control selectpicker" name="http">
                                <option langtag="word-yes" value="1" {{if .p.Http}}selected{{end}}></option>
                                <option langtag="word-no" value="0" {{if not .p.Http}}selected{{end}}></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="socks5">
                        <label class="control-label font-bold" langtag="word-socks5"></label>
                        <div class="col-sm-12">
                            <select class="form-control selectpicker" name="socks5">
                                <option langtag="word-yes" value="1" {{if .p.Socks5}}selected{{end}}></option>
                                <option langtag="word-no" value="0" {{if not .p.Socks5}}selected{{end}}></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="tags">
                        <label class="control-label font-bold" langtag="word-tags"></label>
                        <div class="col-sm-12">
                            <textarea class="form-control" langtag="info-suchastags" name="tags" rows="3">{{.Tags}}</textarea>
                            <span class="help-block m-b-none" langtag="info-desctags"></span>
                        </div>
                    </div>
                    <div class="form-group" id="enabled">
                        <label class="control-label font-bold" langtag="word-enabled"></label>
                        <div class="col-sm-12">
                            <select class="form-control selectpicker" name="enabled">
                                <option langtag="word-yes" value="1" {{if .p.Enabled}}selected{{end}}></option>
                                <option langtag="word-no" value="0" {{if not .p.Enabled}}selected{{end}}></option>
                            </select>
                        </div>
                    </div>
                    <div class="hr-line-dashed"></div>
                    <div class="form-group">
                        <div class="col-lg-12 col-sm-offset-2">
                            <button class="btn btn-secondary" onclick="goback()" type="button">
                                <i class="fa fa-fw fa-lg fa-window-close"></i> <span langtag="word-cancel"></span>
                            </button>
                            <button class="btn btn-success" onclick="submitform('edit', '{{.web_base_url}}/proxynode/edit?id={{.p.Id}}', $('form').serializeArray())" type="button">
                                <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-save"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
