<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>全能代理</h5>
                    <div class="ibox-tools">
                        <a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
                    </div>
                </div>
                <div class="content">
                    <div class="table-responsive">
                        <div id="toolbar">
                            <div class="d-flex w-100 flex-wrap">
                                <a class="btn btn-primary dim mr-2" href="{{.web_base_url}}/omniproxy/add">
                                    <i class="fa fa-fw fa-lg fa-plus"></i> 添加节点
                                </a>
                                <a class="btn btn-info dim mr-2" href="{{.web_base_url}}/omniproxy/import">
                                    <i class="fa fa-fw fa-lg fa-upload"></i> 批量导入 / 订阅
                                </a>
                                <a class="btn btn-success dim mr-2" onclick="omniCheckAll()">
                                    <i class="fa fa-fw fa-lg fa-heartbeat"></i> 检测全部
                                </a>
                            </div>
                        </div>
                        <table id="table" class="table-striped table-hover" data-mobile-responsive="true"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    var omniBase = '{{.web_base_url}}/omniproxy';
    var proxyBase = '{{.web_base_url}}/proxynode';

    function omniEscape(v) { return $('<div/>').text(v == null ? '' : v).html(); }
    function omniReload() { $('#table').bootstrapTable('refresh'); }

    function omniCheckAll() {
        $.post(proxyBase + '/checkall', {}, function () { setTimeout(omniReload, 800); });
    }
    function omniCheck(id) { $.post(proxyBase + '/check', { id: id }, function () { setTimeout(omniReload, 800); }); }
    function omniToggle(id, enabled) { $.post(proxyBase + '/changestatus', { id: id, enabled: enabled ? 1 : 0 }, function () { omniReload(); }); }
    function omniDel(id) {
        if (!confirm('删除该节点?')) { return; }
        $.post(proxyBase + '/del', { id: id }, function () { omniReload(); });
    }

    $('#table').bootstrapTable({
        toolbar: '#toolbar',
        method: 'post',
        contentType: 'application/x-www-form-urlencoded',
        url: omniBase + '/list',
        pagination: true,
        sidePagination: 'client',
        pageSize: 20,
        search: true,
        showRefresh: true,
        showColumns: true,
        idField: 'Id',
        columns: [
            { field: 'Name', title: '名称', sortable: true, formatter: function (v) { return omniEscape(v); } },
            { field: 'Host', title: '地址', sortable: true, formatter: function (v, row) { return omniEscape(v + ':' + row.Port); } },
            {
                field: 'Protocols', title: '协议', sortable: true,
                formatter: function (v) { return '<span class="badge badge-primary">' + omniEscape(v) + '</span>'; }
            },
            { field: 'Method', title: '加密', formatter: function (v) { return v ? omniEscape(v) : '-'; } },
            {
                field: 'Tags', title: 'Tags',
                formatter: function (v) {
                    if (!v || v.length === 0) { return '-'; }
                    var html = '';
                    for (var i = 0; i < v.length; i++) { html += '<span class="badge badge-success" style="margin:1px 2px;">' + omniEscape(v[i]) + '</span>'; }
                    return html;
                }
            },
            {
                field: 'Status', title: '状态', sortable: true,
                formatter: function (v) {
                    var cls = 'badge-secondary';
                    if (v === 'Available') { cls = 'badge-success'; }
                    else if (v === 'Unavailable') { cls = 'badge-danger'; }
                    else if (v === 'Disabled') { cls = 'badge-dark'; }
                    return '<span class="badge ' + cls + '">' + omniEscape(v) + '</span>';
                }
            },
            { field: 'Latency', title: '延迟', sortable: true, formatter: function (v) { return v > 0 ? (v + ' ms') : '-'; } },
            {
                field: 'Id', title: '操作', width: '120px',
                formatter: function (v, row) {
                    var html = '<div class="btn-group">';
                    html += '<button class="btn btn-xs btn-default dropdown-toggle" data-toggle="dropdown">&hellip;</button>';
                    html += '<ul class="dropdown-menu dropdown-menu-right">';
                    html += '<li><a onclick="omniCheck(' + v + ')">检测</a></li>';
                    html += '<li><a onclick="omniToggle(' + v + ',' + (row.Enabled ? '0' : '1') + ')">' + (row.Enabled ? '禁用' : '启用') + '</a></li>';
                    html += '<li class="divider"></li>';
                    html += '<li><a onclick="omniDel(' + v + ')">删除</a></li>';
                    html += '</ul></div>';
                    return html;
                }
            }
        ]
    });
</script>
