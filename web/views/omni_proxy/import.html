<div class="row tile">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins">
            <h3 class="ibox-title">批量导入 / Clash 订阅</h3>
            <div class="ibox-content">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="control-label font-bold">分享链接（一行一个）</label>
                        <div class="col-sm-12">
                            <textarea class="form-control" name="list" rows="10" placeholder="ss://...&#10;vmess://...&#10;vless://...&#10;trojan://...&#10;hysteria2://...&#10;tuic://..."></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label font-bold">Clash 订阅地址（可空）</label>
                        <div class="col-sm-12">
                            <input class="form-control" name="subscription" placeholder="https://example.com/subscribe?token=...">
                            <span class="help-block m-b-none">订阅内容为分享链接列表（base64 或明文）时自动解析。Clash YAML 配置暂不解析。</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label font-bold">统一 Tags</label>
                        <div class="col-sm-12"><input class="form-control" name="tags" placeholder="jp"></div>
                    </div>
                    <div class="form-group">
                        <label class="control-label font-bold">导入后自动检测</label>
                        <div class="col-sm-12">
                            <select class="form-control" name="auto_check">
                                <option value="1" selected>是</option>
                                <option value="0">否</option>
                            </select>
                        </div>
                    </div>
                    <div class="hr-line-dashed"></div>
                    <div class="form-group">
                        <div class="col-lg-12 col-sm-offset-2">
                            <button class="btn btn-secondary" onclick="goback()" type="button"><i class="fa fa-fw fa-lg fa-window-close"></i> 取消</button>
                            <button class="btn btn-success" onclick="submitform('add', '{{.web_base_url}}/omniproxy/import', $('form').serializeArray())" type="button"><i class="fa fa-fw fa-lg fa-check-circle"></i> 导入</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
