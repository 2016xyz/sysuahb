<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>统一协同平台</title>
    <!-- Mainly scripts -->
    <!-- Latest compiled and minified CSS -->
    <link href="{{.web_base_url}}/static/css/fontawesome.min.css" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/solid.min.css" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/style.css?v={{.version}}" rel="stylesheet">
    <!-- Latest compiled and minified JavaScript -->
    <script src="{{.web_base_url}}/static/js/jquery-3.7.1.min.js"></script>
    <script src="{{.web_base_url}}/static/js/bootstrap.min.js"></script>
    <script src="{{.web_base_url}}/static/js/jsencrypt.min.js"></script>
    <script src="{{.web_base_url}}/static/js/crypto-js.min.js"></script>
    <!-- Latest compiled and minified Locales -->
    <script src="{{.web_base_url}}/static/js/language.js?v={{.version}}" type="text/javascript"></script>
    {{.head_custom_code}}
</head>

<body class="login-page">
    <main class="wow-login-page">
        <div class="wow-login-background" aria-hidden="true"></div>
        <div class="wow-login-content">
            <header class="wow-login-header">
                <div class="wow-login-title">统一协同平台</div>
                <div class="wow-login-subtitle">Unified Collaboration Platform</div>
            </header>
            <section class="wow-login-card">
                <div class="wow-language-switch i18n">
                    <button id="languagemenu" type="button" aria-label="Language">中文</button>
                    <ul class="language-list"></ul>
                </div>
                <form class="wow-login-form" onsubmit="return false;">
                    <div class="wow-input-group form-group">
                        <span class="wow-input-icon user-icon" aria-hidden="true"><i class="fas fa-user"></i></span>
                        <input class="form-control" name="username" placeholder="请输入账号" autocomplete="username" required="" type="text">
                    </div>
                    <div class="wow-input-group form-group">
                        <span class="wow-input-icon password-icon" aria-hidden="true"><i class="fas fa-lock"></i></span>
                        <input class="form-control login-pwd" name="password" placeholder="请输入密码" autocomplete="current-password" required="" type="password">
                        <button type="button" class="pwd-toggle" aria-label="toggle password" onclick="togglePwd(this)"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="wow-verification form-group">
                        {{if eq true .captcha_open}}
                        <input class="wow-captcha-input" langtag="word-captcha" name="captcha" placeholder="点击按钮进行验证" required="">
                        <div class="captcha-container" title="click to refresh">{{create_captcha}}</div>
                        {{else}}
                        <span class="wow-verification-label" langtag="word-click2verify">点击按钮进行验证</span>
                        {{end}}
                    </div>
                    <label class="wow-remember"><input type="checkbox" name="remember"> <span langtag="word-remember">记住账号</span></label>
                    <button id="loginBtn" class="btn btn-primary btn-login block full-width" onclick="if (this.form.reportValidity()) login()" type="submit">
                        <span class="btn-label" langtag="word-login"></span>
                        <span class="btn-spinner" aria-hidden="true"><i class="fas fa-circle-notch fa-spin"></i></span>
                    </button>
                    {{if eq true .register_allow}}
                    <p class="text-muted text-center login-alt"><small langtag="info-noaccount"></small> <a href="{{.web_base_url}}/login/register" langtag="word-register"></a></p>
                    {{end}}
                </form>
            </section>
        </div>
    </main>

    <script type="text/javascript">
        window.nps = {
            web_base_url : "{{.web_base_url}}",
            version      : "{{.version}}",
            publicKey    : `{{.public_key}}`,
            loginNonce   : "{{.login_nonce}}",
            loginDelay   : {{.login_delay}},
            totpLen      : {{.totp_len}},
            powBits      : {{.pow_bits}},
            powEnable    : {{if .pow_enable}}true{{else}}false{{end}},
            lastAttempt  : Date.now(),
            timeOffset: 0
        };
        function syncServerTime() {
            var t0 = Date.now();
            $.ajax({
                url: window.nps.web_base_url + "/auth/gettime",
                dataType: "json",
                cache: false,
                timeout: 5000,
                success: function (res) {
                    if (!res || res.time == null) return;
                    var t3 = Date.now();
                    var server = res.time * 1000;
                    if (server == null) return;
                    var rtt = t3 - t0;
                    var estServerAtT3 = server + Math.floor(rtt / 2);
                    window.nps.timeOffset = estServerAtT3 - t3;
                }
            });
        }
        const loginBtn = document.getElementById('loginBtn');
        const rsaEncryptor = new JSEncrypt();
        rsaEncryptor.setPublicKey(window.nps.publicKey);
        function encryptWithRSA(plain) {
            return rsaEncryptor.encrypt(plain);
        }
        async function sha256Uint8(encPwd, nonce) {
            const hex = CryptoJS.SHA256(encPwd + nonce).toString(CryptoJS.enc.Hex);
            const out = new Uint8Array(hex.length >> 1);
            for (let i = 0; i < out.length; i++) {
                out[i] = parseInt(hex.substr(i << 1, 2), 16);
            }
            return out;
        }
        function prefixZero(hashBytes, bits) {
            const full = bits >> 3, rem = bits & 7;
            for (let i = 0; i < full; i++) if (hashBytes[i]) return false;
            return rem ? (hashBytes[full] & (0xFF << (8 - rem))) === 0 : true;
        }
        async function calcPowX(encPwd, bits, timeoutMs = 60000) {
            if (window.Worker) {
                return new Promise((resolve, reject) => {
                    const w = new Worker(window.nps.web_base_url + '/static/js/pow-worker.js');
                    const timer = setTimeout(() => {
                        w.terminate();
                        reject('PoW timeout');
                    }, timeoutMs + 500);
                    w.onmessage = ({ data }) => {
                        if (data.ok) {
                            clearTimeout(timer);
                            w.terminate();
                            resolve(data.nonce.toString());
                        } else if (!data.progress) {
                            clearTimeout(timer);
                            w.terminate();
                            reject('PoW timeout');
                        }
                    };
                    w.postMessage({ encPwd, bits, timeout: timeoutMs });
                });
            } else {
                const endTime = Date.now() + timeoutMs;
                let nonce = (Math.random() * 0xFFFFFFFF) >>> 0;
                while (Date.now() < endTime) {
                    const hash = await sha256Uint8(encPwd, nonce);
                    if (prefixZero(hash, bits)) return nonce.toString();
                    nonce = (nonce + 1) >>> 0;
                    if ((nonce & 0xFFF) === 0) await Promise.resolve();
                }
                throw new Error("PoW timeout");
            }
        }
        $(function () {
            syncServerTime();
            var savedUsername = localStorage.getItem('nps_login_username');
            if (savedUsername) {
                $('input[name="username"]').val(savedUsername);
                $('input[name="remember"]').prop('checked', true);
            }
        });
        function togglePwd(btn) {
            var $input = $(btn).siblings('input.login-pwd');
            var show = $input.attr('type') === 'password';
            $input.attr('type', show ? 'text' : 'password');
            $(btn).find('i').toggleClass('fa-eye fa-eye-slash');
        }
        async function login() {
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');
            showMsg(langreply('Processing'), 'loading', 60000);
            await new Promise(requestAnimationFrame);
            await new Promise(resolve => setTimeout(resolve, 600));
            const data = Object.fromEntries(new FormData(document.querySelector('form')).entries());
            const ts = Date.now() + window.nps.timeOffset;
            const payload = JSON.stringify({
                n: window.nps.loginNonce,
                t: ts,
                p: data.password
            });
            const encPwd  = encryptWithRSA(payload);
            data.password = encPwd;
            const needPow = window.nps.powBits > 0 && (window.nps.powEnable || (data.captcha && data.captcha.length === window.nps.totpLen));
            if (needPow) {
                try {
                    data.powx = await calcPowX(encPwd, window.nps.powBits);
                    data.bits = window.nps.powBits;
                } catch (e) {
                    loginBtn.disabled = false;
                    loginBtn.classList.remove('loading');
                    showMsg(e.toString(), 'error', 4000);
                    return false;
                }
            }
            const now = Date.now();
            const wait = window.nps.loginDelay - (now - window.nps.lastAttempt);
            if (wait > 0) {
              await new Promise(r => setTimeout(r, wait));
            }
            window.nps.lastAttempt = Date.now();
            $.ajax({
                type: "POST",
                url : window.nps.web_base_url + "/login/verify",
                data: data,
                success: function (res) {
                    if (res.status) {
                        if ($('input[name="remember"]').prop('checked')) {
                            localStorage.setItem('nps_login_username', data.username);
                        } else {
                            localStorage.removeItem('nps_login_username');
                        }
                        showMsg(langreply(res.msg), 'success', 1000, function () {
                            window.location.href = window.nps.web_base_url + "/index/index";
                        });
                    } else {
                        {{if eq true .captcha_open}}
                        var $img = $('.captcha-img');
                        if ($img.length) {
                            $img.trigger('click');
                        }
                        $('input[name="captcha"]').val('');
                        {{end}}
                        showMsg(langreply(res.msg), 'error', 3000, function() {
                            loginBtn.disabled = false;
                            loginBtn.classList.remove('loading');
                            if (res.nonce) {
                                window.nps.loginNonce = res.nonce;
                            }
                            if (res.cert) {
                                window.nps.publicKey = res.cert;
                                rsaEncryptor.setPublicKey(res.cert);
                            }
                            if (res.timestamp) {
                                window.nps.timeOffset = res.timestamp - Date.now();
                            }
                            if (res.bits) {
                                window.nps.powBits = res.bits;
                                window.nps.powEnable = true;
                            }
                        });
                    }
                },
                error: function (xhr, textStatus) {
                    console.error("Login request failed:", textStatus);
                    window.location.reload();
                }
            });
            return false;
        }
    </script>
</body>
</html>
